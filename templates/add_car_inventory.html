<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Car to Inventory</title>
</head>
<body>
    <h1>Add New Car to Inventory</h1>
    <form method="POST">
        <label for="car_ID">Car ID:</label>
        <input type="text" id="car_ID" name="car_ID" required><br><br>

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" required><br><br>

        <label for="model_year">Model Year:</label>
        <input type="date" id="model_year" name="model_year" required><br><br>

        <label for="fuel_type">Fuel Type:</label>
        <input type="text" id="fuel_type" name="fuel_type" required><br><br>

        <label for="color">Color:</label>
        <input type="text" id="color" name="color" required><br><br>

        <label for="motor_size">Motor Size:</label>
        <input type="number" id="motor_size" name="motor_size" required><br><br>

        <label for="mator_infarmation">Motor Information:</label>
        <input type="text" id="mator_infarmation" name="mator_infarmation" required><br><br>

        <label for="modal">Model:</label>
        <input type="text" id="modal" name="modal" required><br><br>

        <label for="make">Make:</label>
        <input type="text" id="make" name="make" required><br><br>

        <label for="vin">VIN:</label>
        <input type="number" id="vin" name="vin" required><br><br>

        <label for="Branch_ID">Branch ID:</label>
        <input type="number" id="Branch_ID" name="Branch_ID" required><br><br>

     

        <button type="submit">Add Car</button>
    </form>
</body>
</html>
