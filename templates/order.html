<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Statistics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .stats {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h1>Sales Statistics</h1>

    <div class="stats">
        <h3>Customer with Most Orders: {{ customer_name }}</h3>
        <h3>Total Orders: {{ total_orders }}</h3>
        <h3>Total Sales: ${{ total_sales }}</h3>
        <h3>Most Ordered Code: {{ most_ordered_code }}</h3>
    </div>


</body>
</html>
