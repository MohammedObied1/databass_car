<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Employee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        h1 {
            color: #4CAF50;
            text-align: center;
            margin-top: 50px;
        }

        form {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            margin-top: 30px;
        }

        label {
            font-size: 16px;
            margin-bottom: 8px;
            display: block;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        a {
            margin-top: 20px;
            color: #4CAF50;
            text-decoration: none;
            font-size: 18px;
        }

        a:hover {
            color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Update Employee</h1>

    <form method="POST">
        <label for="Employea_ID">Employee ID:</label>
        <input type="text" id="Employea_ID" name="Employea_ID" value="{{ employee[0] }}" required><br><br>

        <label for="sname">Name:</label>
        <input type="text" id="sname" name="sname" value="{{ employee[1] }}" required><br><br>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" value="{{ employee[2] }}" required><br><br>

        <label for="phone_Number">Phone Number:</label>
        <input type="text" id="phone_Number" name="phone_Number" value="{{ employee[3] }}" required><br><br>

        <label for="sRole">Role:</label>
        <input type="text" id="sRole" name="sRole" value="{{ employee[4] }}" required><br><br>

        <label for="salary">Salary:</label>
        <input type="text" id="salary" name="salary" value="{{ employee[5] }}" required><br><br>

        <label for="Branch_ID">Branch ID:</label>
        <input type="text" id="Branch_ID" name="Branch_ID" value="{{ employee[6] }}" required><br><br>

        <button type="submit">Update Employee</button>
    </form>

    <br>

    <a href="/employees">Back to Employee List</a>

</body>
</html>
