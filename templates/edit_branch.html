<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Branch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 20px;
        }
        h1 {
            color: #4CAF50;
            text-align: center;
            padding-bottom: 20px;
        }
        form {
            width: 50%;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
            display: inline-block;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
            display: block;
            text-align: center;
            margin-top: 20px;
        }
        a:hover {
            color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Edit Branch</h1>
    <form method="POST">
        <label for="address">Address:</label><br>
        <input type="text" name="address" value="{{ branch[1] }}" required><br><br>

        <label for="company_ID">Company ID:</label><br>
        <input type="number" name="company_ID" value="{{ branch[2] }}" required><br><br>

        <input type="submit" value="Update Branch">
    </form>
    <br>
    <a href="{{ url_for('branch') }}">Back to Branch List</a>
</body>
</html>
