<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculate Sales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #333;
            padding-top: 20px;
        }
        form {
            width: 60%;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        label {
            font-size: 16px;
            margin-bottom: 5px;
            display: block;
        }
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .flash {
            padding: 10px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .flash.success {
            background-color: #4CAF50;
            color: white;
        }
        .flash.error {
            background-color: #f44336;
            color: white;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>Calculate Sales</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
                {% for category, message in messages %}
                    <li class="flash {{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="company_id">Company ID:</label>
        <input type="text" id="company_id" name="company_id">
        <br>

        <label for="branch_id">Branch ID:</label>
        <input type="text" id="branch_id" name="branch_id">
        <br>

        <label for="start_date">Start Date:</label>
        <input type="date" id="start_date" name="start_date">
        <br>

        <label for="end_date">End Date:</label>
        <input type="date" id="end_date" name="end_date">
        <br>

        <input type="submit" value="Calculate Sales">
    </form>
</body>
</html>
