<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            background: linear-gradient(135deg, #ff7eb3, #ff758c, #ff6e62, #ffc069, #ffe29f);
            background-size: 400% 400%;
            animation: gradientBackground 15s ease infinite;
        }

        @keyframes gradientBackground {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        form {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        form h2 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 1rem;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            outline: none;
        }

        input, select {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        select {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        select option {
            background: #fff;
            color: #333; /* لون النص داخل القائمة */
        }

        select option:hover {
            background: #f0f0f0;
        }

        button {
            background: #ff6e62;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        button:hover {
            background: #ff758c;
        }

        button:active {
            transform: scale(0.98);
        }

        @media (max-width: 500px) {
            form {
                padding: 15px 20px;
            }
            form h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <form method="POST">
        <h2>Signup</h2>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        
        <label for="password1">Password:</label>
        <input type="password" id="password1" name="password1" placeholder="Enter a strong password" required>
        
        <label for="sname">Full Name:</label>
        <input type="text" id="sname" name="sname" placeholder="Enter your full name" required>
        
        <label for="role">Role:</label>
        <select id="role" name="role">
            <option value="customer">Customer</option>
            <option value="employee">Employee</option>
            <option value="admin">Admin</option>
        </select>
        
        <button type="submit">Signup</button>
    </form>
</body>
</html>
