<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 20px;
        }
        h1 {
            color: #4CAF50;
            text-align: center;
            padding-bottom: 20px;
        }
        .filter-form {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .filter-form input[type="text"] {
            padding: 10px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .filter-form button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .filter-form button:hover {
            background-color: #45a049;
        }
        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }
        a:hover {
            color: #45a049;
        }
        .add-new {
            text-align: center;
            margin-top: 20px;
        }
        .add-new a {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <h1>Customers</h1>

    <!-- نموذج الفلتر -->
    <form method="get" class="filter-form">
        <input type="text" name="name" placeholder="Filter by Name" value="{{ name_filter }}">
        <input type="text" name="phone" placeholder="Filter by Phone" value="{{ phone_filter }}">
        <input type="text" name="address" placeholder="Filter by Address" value="{{ address_filter }}">
        <button type="submit">Apply Filters</button>
    </form>

    <!-- جدول العملاء -->
    <table>
        <tr>
            <th>Customer ID</th>
            <th>Name</th>
            <th>Phone Number</th>
            <th>Address</th>
            <th>Actions</th>
        </tr>
        {% for customer in customers %}
        <tr>
            <td>{{ customer[0] }}</td>
            <td>{{ customer[1] }}</td>
            <td>{{ customer[2] }}</td>
            <td>{{ customer[3] }}</td>
            <td>
                <a href="{{ url_for('edit_customer', customer_id=customer[0]) }}">Edit</a> |
                <a href="{{ url_for('delete_customer', customer_id=customer[0]) }}" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <div class="add-new">
        <a href="{{ url_for('add_customer') }}">Add New Customer</a>
        <a href="{{ url_for('tables') }}">Back to Tables</a>
    </div>
</body>
</html>
