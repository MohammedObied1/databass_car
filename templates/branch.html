<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #333;
            padding-top: 20px;
        }
        a {
            text-decoration: none;
            color: #4CAF50;
            font-size: 16px;
            margin-top: 20px;
            display: block;
            text-align: center;
        }
        a:hover {
            color: #45a049;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        td {
            background-color: #f9f9f9;
        }
        tr:nth-child(even) td {
            background-color: #f1f1f1;
        }
        tr:hover td {
            background-color: #e2f7e1;
        }
        .actions a {
            text-decoration: none;
            color: #007BFF;
            margin: 0 5px;
        }
        .actions a:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Branch List</h1>
    <a href="{{ url_for('add_branch') }}">Add New Branch</a>
    <table>
        <tr>
            <th>Branch ID</th>
            <th>Address</th>
            <th>Company ID</th>
            <th>Actions</th>
        </tr>
        {% for branch in branches %}
        <tr>
            <td>{{ branch[0] }}</td>
            <td>{{ branch[1] }}</td>
            <td>{{ branch[2] }}</td>
            <td class="actions">
                <a href="{{ url_for('edit_branch', branch_id=branch[0]) }}">Edit</a> |
                <a href="{{ url_for('delete_branch', branch_id=branch[0]) }}" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <a href="{{ url_for('tables') }}">Back to Tables</a>
</body>
</html>
