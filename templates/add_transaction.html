<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction</title>
    <style>
        /* إعدادات الصفحة العامة */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            color: #007BFF;
            margin-bottom: 20px;
            font-size: 2em;
        }

        /* تصميم النموذج */
        form {
            width: 400px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
            display: block;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #007BFF;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        /* رابط العودة */
        a {
            text-decoration: none;
            color: #007BFF;
            font-size: 14px;
            display: block;
            text-align: center;
            margin-top: 20px;
        }

        a:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Add New Transaction</h1>
    <form method="POST">
        <label for="transaction_ID">Transaction ID:</label>
        <input type="number" name="transaction_ID" placeholder="Enter Transaction ID" required>

        <label for="car_ID">Car ID:</label>
        <input type="number" name="car_ID" placeholder="Enter Car ID" required>

        <label for="customar_ID">Customer ID:</label>
        <input type="number" name="customar_ID" placeholder="Enter Customer ID" required>

        <label for="supplier_ID">Supplier ID:</label>
        <input type="number" name="supplier_ID" placeholder="Enter Supplier ID" required>

        <label for="transaction_Type">Transaction Type:</label>
        <input type="text" name="transaction_Type" placeholder="Enter Transaction Type" required>

        <label for="Amount">Amount:</label>
        <input type="number" name="Amount" placeholder="Enter Amount" required>

        <label for="company_ID">Company ID:</label>
        <input type="number" name="company_ID" placeholder="Enter Company ID" required>

        <input type="submit" value="Add Transaction">
    </form>
    <a href="{{ url_for('transaction') }}">Back to Transactions</a>
</body>
</html>
