<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company List</title>
</head>
<body>
    <h1>Company List</h1>
    <table border="1">
        <tr>
            <th>Company ID</th>
            <th>Actions</th>
        </tr>
        {% for company in companies %}
            <tr>
                <td>{{ company[0] }}</td>  <!-- Display company_ID -->
                <td>
                    <a href="{{ url_for('delete_company', company_ID=company[0]) }}">Delete</a> | 
                    <a href="{{ url_for('update_company', company_ID=company[0]) }}">Edit</a>
                </td>
            </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/add_company">Add New Company</a>
</body>
</html>
