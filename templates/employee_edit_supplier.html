<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Supplier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8fb;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin: 10px 0 5px;
            font-weight: bold;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Supplier</h1>
        <form method="POST">
            <label for="sname">Name:</label>
            <input type="text" id="sname" name="sname" value="{{ supplier[1] }}" required>

            <label for="phone_number">Phone Number:</label>
            <input type="number" id="phone_number" name="phone_number" value="{{ supplier[2] }}" required>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" value="{{ supplier[3] }}" required>

            <label for="rating">Rating:</label>
            <input type="text" id="rating" name="rating" value="{{ supplier[4] }}" required>

            <label for="car_id">Car ID:</label>
            <input type="number" id="car_id" name="car_id" value="{{ supplier[5] }}" required>

            <button type="submit">Save Changes</button>
        </form>
    </div>
</body>
</html>
