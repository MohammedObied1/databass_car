<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Order</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            max-width: 400px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Edit Order</h1>
    <form method="POST">
        <label for="sname">Name:</label>
        <input type="text" id="sname" name="sname" value="{{ order['sname'] }}" required>

        <label for="phone_Number">Phone Number:</label>
        <input type="text" id="phone_Number" name="phone_Number" value="{{ order['phone_Number'] }}" required>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" value="{{ order['address'] }}" required>

        <label for="Customer_id">Customer ID:</label>
        <input type="text" id="Customer_id" name="Customer_id" value="{{ order['Customer_id'] }}" required>

        <button type="submit">Update Order</button>
    </form>
</body>
</html>
