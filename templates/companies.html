<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            color: #333;
        }
        h1 {
            color: #4CAF50;
            text-align: center;
            padding-bottom: 20px;
        }
        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }
        a:hover {
            color: #45a049;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .actions a {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border-radius: 4px;
            text-align: center;
        }
        .actions a:hover {
            background-color: #45a049;
        }
        .add-new {
            text-align: center;
            margin-top: 20px;
        }
        .add-new a {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <h1>Company Table</h1>
    <table>
        <tr>
            <th>Company ID</th>
            <th>Actions</th>
        </tr>
        {% for company in companies %}
        <tr>
            <td>{{ company[0] }}</td>
            <td class="actions">
                <a href="{{ url_for('edit_company', company_id=company[0]) }}">Edit</a> | 
                <a href="{{ url_for('delete_company', company_id=company[0]) }}" onclick="return confirm('Are you sure you want to delete this company?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <div class="add-new">
        <a href="/add_company">Add New Company</a>
        <a href="{{ url_for('tables') }}">Back to tables</a>
    </div>
</body>
</html>
