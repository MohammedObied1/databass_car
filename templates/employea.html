<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
            margin-top: 40px;
        }
        a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }
        a:hover {
            color: #45a049;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        td a {
            color: #4CAF50;
            font-weight: bold;
        }
        td a:hover {
            color: #45a049;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .actions a {
            padding: 6px 12px;
            background-color: #f4f4f9;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .actions a:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <h1>Employee List</h1>
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="{{ url_for('add_employea') }}" style="padding: 10px 20px; background-color: #4CAF50; color: white; border-radius: 5px; font-size: 16px;">Add New Employee</a>
    </div>
    <table>
        <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Address</th>
            <th>Phone Number</th>
            <th>Role</th>
            <th>Salary</th>
            <th>Branch ID</th>
            <th>Actions</th>
        </tr>
        {% for employea in employees %}
        <tr>
            <td>{{ employea[0] }}</td>
            <td>{{ employea[1] }}</td>
            <td>{{ employea[2] }}</td>
            <td>{{ employea[3] }}</td>
            <td>{{ employea[4] }}</td>
            <td>{{ employea[5] }}</td>
            <td>{{ employea[6] }}</td>
            <td class="actions">
                <a href="{{ url_for('edit_employea', employea_id=employea[0]) }}">Edit</a> |
                <a href="{{ url_for('delete_employea', employea_id=employea[0]) }}" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('tables') }}" style="padding: 10px 20px; background-color: #4CAF50; color: white; border-radius: 5px; font-size: 16px;">Back to Tables</a>
    </div>
</body>
</html>
