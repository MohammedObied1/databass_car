<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            background: linear-gradient(135deg, #6a11cb, #2575fc, #42e695, #3bb2b8);
            background-size: 400% 400%;
            animation: gradientBackground 10s ease infinite;
        }

        @keyframes gradientBackground {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 30px;
            font-size: 28px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 15px 0;
        }

        a {
            display: block;
            text-decoration: none;
            padding: 15px 20px;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        a:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .logout {
            margin-top: 20px;
            text-align: center;
        }

        .logout a {
            display: inline-block;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .logout a:hover {
            background-color: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee Dashboard</h1>
        <ul>
            <li><a href="/employee_manage_orders">Manage Orders</a></li>
            <li><a href="/employee_manage_customers">Manage Customers</a></li>
            <li><a href="/employee_manage_suppliers">Manage Suppliers</a></li>
            <li><a href="/view_inventory">View Inventory</a></li>
            <li><a href="/manage_centers">Manage Branches</a></li>
            <li><a href="/employee_view_payments">View Payments</a></li>
            <li><a href="/employee_view_reports">View Reports</a></li>
        </ul>
        <div class="logout">
            <a href="/login">Logout</a>
        </div>
    </div>
</body>
</html>
