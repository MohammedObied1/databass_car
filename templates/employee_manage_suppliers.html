<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Suppliers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ccc;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        a {
            text-decoration: none;
            color: #4CAF50;
        }
        a:hover {
            color: #45a049;
        }
        .add-button {
            display: inline-block;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .add-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Manage Suppliers</h1>
    <a href="/employee_add_supplier" class="add-button">Add New Supplier</a>
    <table>
        <tr>
            <th>Supplier ID</th>
            <th>Name</th>
            <th>Phone Number</th>
            <th>Address</th>
            <th>Rating</th>
            <th>Car ID</th>
            <th>Actions</th>
        </tr>
        {% for supplier in suppliers %}
        <tr>
            <td>{{ supplier[0] }}</td>
            <td>{{ supplier[1] }}</td>
            <td>{{ supplier[2] }}</td>
            <td>{{ supplier[3] }}</td>
            <td>{{ supplier[4] }}</td>
            <td>{{ supplier[5] }}</td>
            <td>
                <a href="/employee_edit_supplier/{{ supplier[0] }}">Edit</a> |
                <a href="/employee_delete_supplier/{{ supplier[0] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <a href="{{ url_for('employee_dashboard') }}" class="back-link">Back to tables</a>

</body>
</html>
