<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Company</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #333;
            padding-top: 20px;
        }
        form {
            width: 400px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        label {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
            display: block;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
            display: block;
            text-align: center;
            margin-top: 20px;
        }
        a:hover {
            color: #007BFF;
        }
    </style>
</head>
<body>
    <h1>Add New Company</h1>
    <form method="POST">
        <label for="company_ID">Company ID:</label>
        <input type="number" id="company_ID" name="company_ID" required>
        <button type="submit">Add Company</button>
    </form>
    
    <a href="{{ url_for('companies') }}">Back to Companies</a>
</body>
</html>
