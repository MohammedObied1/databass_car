<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
            margin-top: 40px;
        }
        form {
            width: 50%;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-top: 20px;
        }
        label {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        input[type="text"], input[type="date"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
            display: block;
            text-align: center;
            margin-top: 20px;
        }
        a:hover {
            color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Edit Report</h1>
    <form method="POST">
        <label for="report_ID">Report ID:</label>
        <input type="text" name="report_ID" value="{{ repost[0] }}" required>

        <label for="start_Date">Start Date:</label>
        <input type="date" name="start_Date" value="{{ repost[1] }}" required>

        <label for="end_Date">End Date:</label>
        <input type="date" name="end_Date" value="{{ repost[2] }}" required>

        <label for="total_sales">Total Sales:</label>
        <input type="number" name="total_sales" value="{{ repost[3] }}" required>

        <label for="company_ID">Company ID:</label>
        <input type="text" name="company_ID" value="{{ repost[4] }}" required>

        <input type="submit" value="Update Report">
    </form>
    <a href="/reposts">Back to Reports</a>
</body>
</html>
