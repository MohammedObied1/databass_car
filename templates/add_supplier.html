<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Supplier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #333;
            padding-top: 20px;
        }
        form {
            width: 400px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        label {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
            display: block;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
            display: block;
            text-align: center;
            margin-top: 20px;
        }
        a:hover {
            color: #007BFF;
        }
    </style>
</head>
<body>
    <h1>Add New Supplier</h1>
    <form method="POST">
        <label for="supplier_id">Supplier ID:</label>
        <input type="number" name="supplier_id" required><br><br>

        <label for="sname">Name:</label>
        <input type="text" name="sname" required><br><br>

        <label for="phone_Number">Phone Number:</label>
        <input type="number" name="phone_Number" required><br><br>

        <label for="Address">Address:</label>
        <input type="text" name="Address" required><br><br>

        <label for="Rating">Rating:</label>
        <input type="text" name="Rating" required><br><br>

        <label for="car_ID">Car ID:</label>
        <input type="number" name="car_ID" required><br><br>

        <input type="submit" value="Add Supplier">
    </form>
    <br>
    <a href="{{ url_for('supplier') }}">Back to Suppliers</a>
</body>
</html>
