<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Branch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        label {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
            display: block;
            text-align: center;
            margin-top: 20px;
        }
        a:hover {
            color: #007BFF;
        }
    </style>
</head>
<body>
    <h1>Add New Branch</h1>
    <form method="POST">
        <label for="branch_ID">Branch ID:</label><br>
        <input type="number" name="branch_ID" required><br><br>

        <label for="address">Address:</label><br>
        <input type="text" name="address" required><br><br>

        <label for="company_ID">Company ID:</label><br>
        <input type="number" name="company_ID" required><br><br>

        <input type="submit" value="Add Branch">
    </form>
    <br>
    <a href="{{ url_for('branch') }}">Back to Branch List</a>
</body>
</html>
