<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #4CAF50;
            text-align: center;
        }
        table {
            width: 80%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #ddd;
        }
        a {
            color: #4CAF50;
            text-decoration: none;
        }
        a:hover {
            color: #45a049;
        }
        .actions {
            display: flex;
            justify-content: center;
        }
        .actions a {
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <h1>Payments List</h1>
    <a href="{{ url_for('add_payment') }}" style="padding: 10px 20px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 4px;">Add New Payment</a>
    <table>
        <tr>
            <th>Payment ID</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Method</th>
            <th>Transaction ID</th>
            <th>Branch ID</th>
            <th>Actions</th>
        </tr>
        {% for payment in payments %}
        <tr>
            <td>{{ payment[0] }}</td>
            <td>{{ payment[1] }}</td>
            <td>{{ payment[2] }}</td>
            <td>{{ payment[3] }}</td>
            <td>{{ payment[4] }}</td>
            <td>{{ payment[5] }}</td>
            <td class="actions">
                <a href="{{ url_for('edit_payment', payment_id=payment[0]) }}">Edit</a> |
                <a href="{{ url_for('delete_payment', payment_id=payment[0]) }}" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <a href="{{ url_for('tables') }}" style="margin-top: 20px; display: inline-block; padding: 10px 20px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 4px;">Back to tables</a>
</body>
</html>
